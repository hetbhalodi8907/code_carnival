<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Nexora Secure AI Workspace" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Nexora · Secure AI Workspace</title>
    <script>
      // Apply the saved theme before first paint (dark by default).
      try {
        if (localStorage.getItem("nexora.theme") === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
    <style>
      /* Boot screen: visible until React mounts and replaces #root, so a slow or failed start is never a blank page. */
      html { background: #f9fafc; color: #121720; }
      html.dark { background: #090c13; color: #edf0f4; }
      .boot { display: grid; place-content: center; gap: 10px; min-height: 100vh; padding: 16px; text-align: center; font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .boot strong { font-size: 13px; letter-spacing: 0.24em; }
      .boot span { max-width: 28rem; opacity: 0.7; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <strong>NEXORA</strong>
        <span id="boot-message">Starting the secure workspace…</span>
      </div>
    </div>
    <noscript><div class="boot"><strong>NEXORA</strong><span>Nexora needs JavaScript enabled.</span></div></noscript>
    <script>
      // A script that fails to load or link before the app mounts: explain instead of hanging silently.
      window.addEventListener(
        "error",
        function () {
          var message = document.getElementById("boot-message");
          if (message) message.textContent = "Nexora couldn't start. Reload the page; if it persists, check the terminal running the frontend.";
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
